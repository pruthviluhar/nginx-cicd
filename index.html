<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Life</title>

```
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, #ffecd2, #fcb69f);
        overflow: hidden;
    }

    .container {
        text-align: center;
        padding: 50px;
    }

    .emoji {
        font-size: 70px;
        margin-bottom: 20px;
        animation: float 3s ease-in-out infinite;
    }

    h1 {
        font-size: 64px;
        color: #ffffff;
        text-shadow: 0 5px 20px rgba(0, 0, 0, 0.15);
        margin-bottom: 15px;
    }

    p {
        font-size: 22px;
        color: white;
        opacity: 0.95;
    }

    .heart {
        color: #ff4f81;
    }

    @keyframes float {
        0%, 100% {
            transform: translateY(0);
        }

        50% {
            transform: translateY(-15px);
        }
    }

    @media (max-width: 600px) {
        h1 {
            font-size: 42px;
        }

        p {
            font-size: 18px;
        }

        .emoji {
            font-size: 55px;
        }
    }
</style>
```

</head>

<body>

```
<div class="container">
    <div class="emoji">🌸</div>

    <h1>Happy Life ✨</h1>

    <p>
        Enjoy every moment, smile every day
        <span class="heart">❤️</span>
    </p>
</div>
```

</body>
</html>
